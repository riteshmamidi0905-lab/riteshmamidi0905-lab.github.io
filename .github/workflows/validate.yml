name: Validate cinematic portfolio
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm test
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium
      - name: Browser, responsive, accessibility and reduced-motion checks
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          npm run test:browser
      - name: Lighthouse mobile and desktop release gates
        run: |
          npx --yes lighthouse@13.5.0 http://127.0.0.1:8000/ --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=work/lighthouse-mobile.json --quiet
          npx --yes lighthouse@13.5.0 http://127.0.0.1:8000/ --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=work/lighthouse-desktop.json --quiet
          node -e "for(const p of ['mobile','desktop']){const r=require('./work/lighthouse-'+p+'.json');for(const k of ['performance','accessibility','best-practices','seo'])if(r.categories[k].score<0.95)throw Error(p+' '+k+' below 95')}"
