name: Validate portfolio
on:
  push:
    branches: [main, 'wip/**', 'claude/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && git diff --exit-code -- index.html recruiter.html support-escalation-copilot.html agent-runtime.html evaluation.html projects.html mcp-weir.html nasha-lab.html profile/README.md assets/js/nasha-integration-evidence.js deliverables/nasha-ecosystem/nasha-preview.html
      - name: Evidence is byte-identical to the pinned public commit
        run: npm run verify:evidence:online
      - uses: actions/checkout@v4
        with:
          repository: riteshmamidi0905-lab/INDO-MEX-BREWERY
          ref: 2fc100070025cfee8d40216c25326ad3a6040cb0
          path: work/engineering
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: riteshmamidi0905-lab/mcp-weir
          ref: 5df274563a4a73ebbd31a6380e3a7d829b6bf4a2
          path: work/weir
          persist-credentials: false
      - name: Actual pinned Python services and THE WEIR reproduce synthetic evidence
        run: python3 scripts/run-nasha-integration.py --engineering-root work/engineering --weir-root work/weir --check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 8000 &
          npm run test:browser
          npm run test:experience
          npm run test:budget
          npm run test:a11y
          npm run test:weir
          npm run test:nasha
          node scripts/test-nasha-command-center.js
          npm run test:ecosystem
          node scripts/review-nasha-keyboard.js
