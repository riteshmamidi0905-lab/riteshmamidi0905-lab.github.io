name: Validate cinematic portfolio
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Source validation (reviewed files, disclosure rules, publication-boundary tests, unit tests)
        run: npm run build && npm test
      - run: npm audit --audit-level=low
      - name: Publication validation (build the allowlisted GitHub Pages artifact and verify it; nothing is deployed or uploaded)
        run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Browser, responsive, accessibility and reduced-motion checks (site, enterprise demo and data lab)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist > /tmp/portfolio-http.log 2>&1 &   # the browser, accessibility and Lighthouse gates test the artifact that would be published
          npm run test:browser
          npm run test:demo
          npm run test:datalab
          npm run test:paint
          npm run test:fonts
      - name: Lighthouse mobile and desktop release gates
        run: |
          for page in home:/ demo:/demo/ lab:/data-lab.html; do
            n=${page%%:*}; u=${page#*:}
            npx --yes lighthouse@13.5.0 "http://127.0.0.1:8000$u" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=work/lighthouse-$n-mobile.json --quiet
            npx --yes lighthouse@13.5.0 "http://127.0.0.1:8000$u" --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path=work/lighthouse-$n-desktop.json --quiet
          done
          node -e "for(const n of ['home','demo','lab'])for(const p of ['mobile','desktop']){const r=require('./work/lighthouse-'+n+'-'+p+'.json');for(const k of ['performance','accessibility','best-practices','seo'])if(r.categories[k].score<0.95)throw Error(n+' '+p+' '+k+' below 95')}"
