name: Validate portfolio
on:
  push:
    branches: [main, 'wip/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && git diff --exit-code -- index.html recruiter.html support-escalation-copilot.html agent-runtime.html evaluation.html projects.html mcp-weir.html profile/README.md
      - name: Evidence is byte-identical to the pinned public commit
        run: npm run verify:evidence:online
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 8000 &
          npm run test:browser
          npm run test:experience
          npm run test:budget
          npm run test:a11y
          npm run test:weir
