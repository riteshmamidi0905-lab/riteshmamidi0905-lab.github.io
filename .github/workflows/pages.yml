# Production deployment of the allowlisted GitHub Pages artifact.
#
# Adding this file to a branch or pull request cannot deploy anything:
#   * it triggers only on a push to main and on a manual run; there is no pull_request, pull_request_target, workflow_run or schedule trigger;
#   * every job requires refs/heads/main, so a manual run started from any other branch skips every job;
#   * the first job fails unless the repository's Pages source is "GitHub Actions" (while it is still the legacy branch build, nothing is built or deployed);
#   * the deploy job runs in the github-pages environment, which is restricted to the main branch.
# It publishes ONLY dist/, built from scripts/publish-manifest.json and verified by scripts/verify-pages-artifact.py.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: pages-production       # shared with rollback.yml: a deployment and a rollback can never run at the same time
  cancel-in-progress: false
env:
  SITE_URL: https://riteshmamidi0905-lab.github.io
jobs:
  guard:
    name: Pages must be artifact-deployed (no fallback to repository-root publication)
    if: github.repository == 'riteshmamidi0905-lab/riteshmamidi0905-lab.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    steps:
      - name: Refuse to run unless Pages is set to deploy from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .build_type)" = "workflow"
  build:
    name: Build and verify the publication artifact
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tree_digest: ${{ steps.digest.outputs.tree_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Source validation
        run: npm run build && npm test
      - run: npm audit --audit-level=low
      - name: Build the allowlisted artifact and verify it (exactly the publication manifest, nothing else)
        run: npm run build:pages
      - name: Record the release (the commit and tree digest are what a rollback needs)
        id: digest
        run: |
          d=$(python3 scripts/verify-pages-artifact.py dist --no-http | grep -o 'tree digest [0-9a-f]\{64\}' | head -1 | awk '{print $3}')
          test -n "$d"
          echo "tree_digest=$d" >> "$GITHUB_OUTPUT"
          {
            echo "### Release record"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- tree digest: \`$d\`"
            echo "- run: $GITHUB_RUN_ID"
            echo "- to restore this release, run the rollback workflow with release_sha=\`$GITHUB_SHA\` and expected_tree_digest=\`$d\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: dist
          retention-days: 90
  deploy:
    name: Deploy the verified artifact
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write              # publish to Pages (this job only)
      id-token: write           # prove the deployment comes from this workflow (this job only)
    environment:
      name: github-pages        # restricted to the main branch; required reviewers here add a human approval before every deploy
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
  verify-live:
    name: Live site equals this exact release; development URLs are unavailable
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false      # default ref: the very commit that was built and deployed
      - name: Pages is still artifact-deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pages" -q .build_type)" = "workflow"
      - name: Compare the live site with this commit's publication manifest and the recorded tree digest
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.tree_digest }}
        run: python3 scripts/verify-live-site.py "$SITE_URL" --manifest scripts/publish-manifest.json --expect-digest "$EXPECTED_DIGEST" --summary "$GITHUB_STEP_SUMMARY" --wait 300
