<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>NASHA Living Headquarters</title>
<meta name="description" content="A navigable 3D headquarters for twelve AI agents, driven by hash-verified recordings of real mission runs on synthetic data. Part of Ritesh Mamidi's portfolio; not a live system and not an operating business.">
<link rel="icon" href="../../mark.svg" type="image/svg+xml"><link rel="stylesheet" href="living-hq.css"></head>
<body>
<a class="skip" href="#panel">Skip to the information panel</a>
<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true">N</span><div><b>NASHA</b> Living Headquarters<small>Synthetic data · recorded runs · not live</small></div></div>
  <p id="loc" class="loc" aria-live="off"></p><p id="status" class="status" role="status"><span class="chip" data-k="rec">RECORDED</span><span id="status-text">Loading the recorded missions · mode: recorded, not live</span></p>
  <div class="tools" role="group" aria-label="Display settings">
    <button type="button" id="t-anim" aria-pressed="true">Animations: on</button>
    <button type="button" id="t-low" aria-pressed="false">Low-power: off</button>
    <button type="button" id="t-2d" aria-pressed="false">2D plan view</button>
    <a class="btn" href="../../recruiter.html" id="l-recruit">Recruiter summary</a>
    <a class="btn" href="../../index.html">Portfolio home</a>
  </div>
</header>
<main class="hq">
  <section class="stage" aria-label="Headquarters view">
    <canvas id="gl" tabindex="0" role="application" aria-label="3D headquarters. Arrow keys orbit the camera, plus and minus zoom, Home resets the view, keys 1 to 6 move between spaces, Enter opens the selected object. Everything shown here is also in the panel beside it."></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div class="hud"><button type="button" id="b-home">Return to headquarters</button><button type="button" id="cam-reset">Reset camera</button><button type="button" id="skip-intro" hidden>Skip transition</button></div>
    <div id="plan" hidden></div>
    <p id="gl-msg" class="gl-msg" hidden></p>
  </section>
  <aside class="side">
    <nav aria-label="Headquarters spaces" id="nav"></nav>
    <div id="panel" tabindex="-1"></div>
    <details id="perf"><summary>Performance (measured in this browser)</summary><dl id="perf-dl"></dl></details>
  </aside>
</main>
<p id="live" class="sr" aria-live="polite"></p>
<noscript><p class="ns">JavaScript is required for the interactive headquarters. The recorded missions, results and recruiter summary are available without it in <a href="../../recruiter.html">the recruiter summary</a>.</p></noscript>
<script src="../event-verify.js"></script><script src="hq-events.js"></script><script src="hq-gl.js"></script><script src="hq-worlds.js"></script><script src="hq-scene.js"></script><script src="hq-app.js"></script>
</body></html>
